name: Release
run-name: ${{ github.actor }} release ${{ inputs.bump }} on ${{ github.repository }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist the PAT so the tag push triggers tag.yml (npm publish).
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both checks run BEFORE release-flow: the tag is what triggers the npm
      # publish, so nothing gets tagged that we could not actually ship.
      - name: Verify NPM token is valid
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm whoami --registry https://registry.npmjs.org/

      - name: Smoke test before tagging
        run: |
          npm ci
          npm test

      - name: Release
        uses: softwarity/release-flow@v1
        with:
          bump: ${{ inputs.bump }}
          # language auto-detected: package.json → node (bumps the version there,
          # resolves the "## NEXT RELEASE" notes section, tags v<version>, and
          # publishes the GitHub Release from those notes)
